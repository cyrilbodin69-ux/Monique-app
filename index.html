    ${s.scopeDialog ? renderScopeDialog(s.scopeDialog) : ''}
    ${s.activeSheet === 'addProjectLine' ? renderAddProjectLineSheet(s) : ''}
  `;

  // Avant de remplacer le DOM : mémoriser la hauteur actuelle de chaque bloc ouvert,
  // pour pouvoir animer vers la nouvelle au lieu de sauter.
  const prevHeights = {};
  document.querySelectorAll('.collapse').forEach(el => {
    const key = el.getAttribute('data-collapse') || ('env:' + el.getAttribute('data-collapse-env'));
    if (key) prevHeights[key] = el.getBoundingClientRect().height;
  });
  // La carte du solde change de hauteur quand un poste de légende disparaît
  // (ex : plus rien « à confirmer ») : sans ça, elle se réduirait d'un coup.
  const soldeEl = document.querySelector('.solde');
  const prevSoldeHeight = soldeEl ? soldeEl.getBoundingClientRect().height : null;

  // Si une sheet remplace une autre sheet déjà affichée, morphNode réutilise le même
  // nœud .sheet-overlay et se contente de changer sa classe — le navigateur ne rejoue
  // alors jamais l'animation d'entrée, puisqu'à ses yeux l'élément existait déjà.
  // On le force : retirer la classe, forcer un reflow, la remettre au frame suivant.
  const overlayExistedBefore = !!document.querySelector('.sheet-overlay');

  applyHtml(document.getElementById('screen'), html);

  if (sheetJustOpened && overlayExistedBefore) {
    const overlay = document.querySelector('.sheet-overlay');
    if (overlay && overlay.classList.contains('entering')) {
      overlay.classList.remove('entering');
      void overlay.offsetHeight;
      requestAnimationFrame(() => overlay.classList.add('entering'));
    }
  }

  // Le contenu de chaque carte de la story (titre, texte, illustration) doit
  // apparaître en douceur à chaque changement — y compris la toute première carte,
  // sinon l'ouverture de la sheet s'arrête net avec tout le texte déjà plein cadre.
  if (s.activeSheet === 'story' && s.storyIndex !== lastStoryIndex) {
    const content = document.querySelector('.story-content');
    if (content) {
      content.classList.remove('card-in');
      void content.offsetHeight;
      requestAnimationFrame(() => content.classList.add('card-in'));
    }
  }
  lastStoryIndex = s.activeSheet === 'story' ? s.storyIndex : -1;

  const soldeAfter = document.querySelector('.solde');
  if (soldeAfter && prevSoldeHeight !== null) {
    soldeAfter.style.height = 'auto';
    const targetSolde = soldeAfter.getBoundingClientRect().height;
    if (Math.abs(prevSoldeHeight - targetSolde) > 1) {
      soldeAfter.style.transition = 'none';
      soldeAfter.style.height = prevSoldeHeight + 'px';
      void soldeAfter.offsetHeight;
      soldeAfter.style.transition = 'height 0.3s cubic-bezier(0.22,1,0.36,1)';
      soldeAfter.style.height = targetSolde + 'px';
      setTimeout(() => { if (soldeAfter.isConnected) soldeAfter.style.height = ''; }, 320);
    } else {
      soldeAfter.style.height = '';
    }
  }

  // Ordre inverse du document : les conteneurs imbriqués (enveloppes) sont dimensionnés
  // avant leur parent, sinon le parent mesure une hauteur d'enfant encore nulle
  // et le contenu déborde du bloc.
  Array.from(document.querySelectorAll('.collapse')).reverse().forEach(el => {
    const inner = el.firstElementChild;
    if (!inner) return;
    const key = el.getAttribute('data-collapse') || ('env:' + el.getAttribute('data-collapse-env'));
    const isOpen = el.classList.contains('open');
    const target = isOpen ? inner.scrollHeight : 0;
    const prev = prevHeights[key];

    if (prev !== undefined && Math.abs(prev - target) > 8) {
      // Le contenu a changé pendant que le bloc était ouvert (ex: une ligne confirmée
      // change de section) : on part de l'ancienne hauteur et on glisse vers la nouvelle.
      el.style.transition = 'none';
      el.style.height = prev + 'px';
      void el.offsetHeight; // force le navigateur à prendre en compte la hauteur de départ
      el.style.transition = 'height 0.28s cubic-bezier(0.22,1,0.36,1)';
      el.style.height = target + 'px';
    } else {
      el.style.transition = 'none';
      el.style.height = target + 'px';
      requestAnimationFrame(() => { el.style.transition = ''; });
    }
  });
  // La ligne qui vient d'être confirmée réapparaît dans une autre section :
  // on la fait éclore doucement plutôt que de la voir surgir.
  if (justConfirmedId) {
    const el = document.querySelector('[data-row-id="' + justConfirmedId + '"]');
    if (el) {
      el.style.animation = 'none';
      el.style.opacity = '0';
      el.style.transform = 'translateX(-8px)';
      requestAnimationFrame(() => {
        el.style.transition = 'opacity 0.2s ease, transform 0.24s cubic-bezier(0.22,1,0.36,1)';
        el.style.opacity = '1';
        el.style.transform = 'translateX(0)';
      });
    }
    justConfirmedId = null;
  }

  // Une pastille fraîchement créée éclot une seule fois.
  if (justPickedCategory) setTimeout(() => { justPickedCategory = null; }, 400);

  const dWrapper = document.getElementById('drawerWrapper');
  if (dWrapper) {
    const dPanel = document.getElementById('drawerPanel');
    dWrapper.style.transition = '';
    dWrapper.style.height = (s.drawerOpen && dPanel) ? dPanel.scrollHeight + 'px' : '0px';
  }
  lastActiveSheet = s.activeSheet;
  lastBlocksOpen = { ...s.blocksOpen };
  lastEnvOpen = Object.fromEntries(s.envelopeDefs.map(e => [e.id, e.open]));
  lastCurrentTab = s.currentTab;
}

// En-tête coloré d'un formulaire : reprend la teinte du bloc d'où il vient,
// pour qu'on sache immédiatement de quoi on parle.
function sheetHead(title, bg, fg, onClose) {
  return `<div class="sheet-head" style="background:${bg}; color:${fg};">
    <span class="t">${title}</span>
    <button class="back-btn" style="color:${fg};" onclick="${onClose || 'closeSheet()'}">${xSvg()}</button>
  </div>`;
}

  const absNow = absMonth(state.year, state.monthIndex);
  return `
    <div class="sheet-overlay ${sheetJustOpened ? 'entering' : ''}" onclick="closeSheet()">
      <div class="sheet" onclick="event.stopPropagation()">

// Curseur centré sur le 1er : à gauche on remonte vers la fin du mois précédent
// (31, 30, 29...), à droite on avance dans le mois (2, 3, 4...).
function offsetToDay(off) {
  if (off === 0) return 1;
  return off > 0 ? 1 + off : 32 + off;
}
function dayToOffset(day) {
  if (day === 1) return 0;
  return day <= 16 ? day - 1 : day - 32;
}
function dayOffsetCaption(day) {
  if (day === 1) return 'découpage classique';
  if (day > 16) return 'du mois précédent';
  return 'du mois en cours';
}

// ============================================================================
//  SAUVEGARDE MANUELLE
//  Le stockage du navigateur est lié à un appareil : un fichier exportable
//  permet de changer de téléphone sans tout perdre, en attendant une
//  synchronisation en ligne.
// ============================================================================
function exportData() {
  writeStateNow();
  const data = {};
  PERSISTED_FIELDS.forEach(k => { data[k] = state[k]; });
  const payload = JSON.stringify({ version: SCHEMA_VERSION, exportedAt: new Date().toISOString(), data }, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'monique-sauvegarde-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const version = parsed.version || 1;
        if (version > SCHEMA_VERSION) {
          askAlert('Cette sauvegarde vient d\'une version plus récente de Monique. Mets l\'application à jour avant de l\'importer.');
          return;
        }
        const data = migrate(parsed.data || parsed, version);
        if (!data || typeof data !== 'object') { askAlert('Ce fichier ne ressemble pas à une sauvegarde Monique.'); return; }
        askConfirm('Remplacer toutes tes données actuelles par cette sauvegarde ? Ce qui est à l\'écran sera perdu.', 'reallyImportData', data);
      } catch (e) {
        askAlert('Ce fichier ne peut pas être lu. Vérifie qu\'il s\'agit bien d\'une sauvegarde Monique.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function reallyImportData(data) {
  const patch = {};
  PERSISTED_FIELDS.forEach(k => { if (data[k] !== undefined) patch[k] = data[k]; });
  patch.activeSheet = null;
  setState(patch);
  refreshCurrentAbs();
  setState({});
}

// ============================================================================
//  FICHE DU MOIS
//  Tout ce qui concerne une période précise : son point de départ, ce qui
//  y commence, ce qui s'y termine. Accessible en tapant le nom du mois.

function openMonthSheet() { setState({ activeSheet: 'monthSheet' }); }

function setOpeningBalance(value) {
  const m = absMonth(state.year, state.monthIndex);
  const clean = String(value).replace(',', '.').trim();
  setState(s => {
    const next = { ...s.openingBalances };
    if (clean === '') delete next[m]; else next[m] = parseFloat(clean);
    return { openingBalances: next };
  });
}
function clearOpeningBalance() {
  const m = absMonth(state.year, state.monthIndex);
  setState(s => { const next = { ...s.openingBalances }; delete next[m]; return { openingBalances: next }; });
}

function renderMonthSheet(s) {
  const m = absMonth(s.year, s.monthIndex);
  const b = periodBounds(m);
  const fmtD = (dt) => (dt.getUTCDate() === 1 ? '1er' : dt.getUTCDate()) + ' ' + MONTHS[dt.getUTCMonth()].toLowerCase();
  const bal = estimatedBalance(m);
  const saisi = hasOpeningBalance(m);

  // Ce qui démarre et ce qui se termine dans cette période précise
  const debutent = [
    ...s.recurrentDefs.filter(d => d.startMonth === m).map(d => ({ nom: d.nom, montant: d.montant, type: 'dépense' })),
    ...s.incomeRecurrentDefs.filter(d => d.startMonth === m).map(d => ({ nom: d.nom, montant: d.montant, type: 'revenu' })),
    ...s.envelopeDefs.filter(e => e.startMonth === m).map(e => ({ nom: e.nom, montant: e.montant, type: 'budget' })),
  ];
  const finissent = [
    ...s.recurrentDefs.filter(d => d.dureeType === 'mois' && activeInMonth(d, m) && !activeInMonth(d, m + 1))
      .map(d => ({ nom: d.nom, montant: d.montant, type: 'dépense' })),
    ...s.incomeRecurrentDefs.filter(d => d.dureeType === 'mois' && activeInMonth(d, m) && !activeInMonth(d, m + 1))
      .map(d => ({ nom: d.nom, montant: d.montant, type: 'revenu' })),
  ];
  const projetsDuMois = s.projects.filter(p => s.projectLines.some(l => l.projectId === p.id && lineMonth(l) === m));

  const ligne = (it, couleur) => `
    <div style="display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; font-size:13px; border-bottom:1px solid rgba(32,30,29,0.06);">
      <span>${it.nom} <span style="font-size:11px; color:var(--muted);">· ${it.type}</span></span>
      <span style="font-weight:600; color:${couleur};">${fmt(it.montant)}</span>
    </div>`;

  return `
    <div class="sheet-overlay ${sheetJustOpened ? 'entering' : ''}" onclick="closeSheet()">
      <div class="sheet" onclick="event.stopPropagation()">
        ${sheetHead(monthYearLabel(m), 'var(--indigo-200)', 'var(--indigo-900)')}
        <div class="sheet-body">

          <div style="display:inline-flex; align-items:center; gap:6px; background:var(--indigo-200); color:var(--indigo-900); border-radius:20px; padding:6px 12px 6px 10px; font-size:12.5px; font-weight:600; margin-bottom:16px;">
            ${calendarSvg('var(--indigo-900)')}<span>Période du ${fmtD(b.from)} au ${fmtD(b.to)}</span>
          </div>
          ${monthStartDay() > 1 ? `<p style="margin:-10px 0 16px;"><span onclick="goProfileSub('monthStart')" style="font-size:12px; text-decoration:underline; cursor:pointer; color:var(--muted);">modifier le découpage</span></p>` : ''}

          <p class="field-label" style="margin-top:0;">Solde du compte en début de période</p>
          <p style="font-size:12px; color:var(--muted); margin:0 0 8px; line-height:1.5;">Ajoute ton solde du ${fmtD(b.from)} pour préciser l'estimation.</p>
          <div class="amount-wrap"><input type="number" id="openingInput" class="big" placeholder="0"
                 value="${saisi ? s.openingBalances[m] : ''}"
                 oninput="setOpeningBalance(this.value)"><span class="amount-suffix">€</span></div>
          ${saisi
            ? `<div class="edit-link" style="color:var(--alert); justify-content:flex-start;" onclick="clearOpeningBalance()">${xSvg()}<span>Retirer ce point de départ</span></div>`
            : (bal.ancre
                ? `<p style="font-size:11.5px; color:var(--muted); margin:6px 0 0; line-height:1.5;">Repris du mois précédent : <strong>${fmt(bal.opening)}</strong>. Corrige-le si ton relevé diffère.</p>`
                : `<p style="font-size:11.5px; color:var(--muted); margin:6px 0 0; line-height:1.5;">Sans lui, le chiffre en haut de l'accueil reste un écart, pas un solde.</p>`)}

          <div style="background:var(--indigo-200); border-radius:6px 18px 18px 18px; padding:14px 16px; margin:18px 0 6px;">
            <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--indigo-900); padding:3px 0;">
              <span style="opacity:0.8;">Point de départ</span><span style="font-weight:600;">${bal.ancre ? fmt(bal.opening) : '—'}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--indigo-900); padding:3px 0;">
              <span style="opacity:0.8;">Mouvements du mois</span><span style="font-weight:600;">${bal.mouvement >= 0 ? '+' : '−'}${fmt(Math.abs(bal.mouvement))}</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:baseline; border-top:1.5px solid rgba(28,46,66,0.25); margin-top:6px; padding-top:8px;">
              <span style="font-size:13px; font-weight:600; color:var(--indigo-900);">Solde estimé en fin de période</span>
              <span style="font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:20px; color:var(--indigo-900);">${fmt(bal.total)}</span>
            </div>
          </div>

          ${finissent.length ? `
            <p class="field-label" style="margin-top:20px;">Se termine ce mois-ci</p>
            <p style="font-size:11.5px; color:var(--muted); margin:0 0 4px;">N'apparaîtra plus le mois prochain.</p>
            ${finissent.map(it => ligne(it, 'var(--terracotta-900)')).join('')}` : ''}

          ${projetsDuMois.length ? `
            <p class="field-label" style="margin-top:20px;">Projets actifs</p>
            ${projetsDuMois.map(p => {
              const dep = s.projectLines.filter(l => l.projectId === p.id && lineMonth(l) === m && l.type === 'depense').reduce((a, l) => a + l.amount, 0);
              return `<div style="display:flex; justify-content:space-between; padding:8px 0; font-size:13px; border-bottom:1px solid rgba(32,30,29,0.06); cursor:pointer;" onclick="closeSheet(); goToProjectInTab('${p.id}')">
                <span>${p.nom}</span><span style="font-weight:600; color:var(--prune-900);">${fmt(dep)}</span></div>`;
            }).join('')}` : ''}

          ${(!finissent.length && !projetsDuMois.length)
            ? `<p style="font-size:12px; color:var(--muted); margin-top:20px; line-height:1.5;">Rien ne se termine ce mois-ci.</p>` : ''}

          <div style="height:6px;"></div>
        </div>
      </div>
    </div>`;
}

function targetSvgInline() { return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none"><circle cx="12" cy="12" r="8" stroke="#f9f4ed" stroke-width="2"/><circle cx="12" cy="12" r="3.2" stroke="#f9f4ed" stroke-width="2"/></svg>'; }
function receiptSvgInline() { return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M6 3h12v17l-2.5-1.5L13 20l-2.5-1.5L8 20l-2-1.5V3z" stroke="#f9f4ed" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke="#f9f4ed" stroke-width="2" stroke-linecap="round"/></svg>'; }

function renderDrawerContent(m) {
  const dep = remainingExpenses(m);
  const totalDep = dep.reduce((a, i) => a + i.amount, 0);
  const rev = remainingIncomes(m);
  const totalRev = rev.reduce((a, i) => a + i.amount, 0);
  const rowIcon = (it) => it.state === 'a_confirmer' ? clockSvg('var(--alert)') : calendarSvg('var(--muted)');

  // Rien du tout : un seul message clair plutôt que deux zéros et deux « rien ».
  if (dep.length === 0 && rev.length === 0) {
    const isPast = m < CURRENT_ABS;
    return `
      <div style="padding:16px 0 20px;">
        <p style="font-size:12px; color:var(--muted); margin:0; line-height:1.6;">${isPast ? 'Mois terminé — tout a été réglé.' : 'Rien à détailler : tout ce qui reste ce mois-ci est déjà confirmé.'}</p>
      </div>`;
  }

  return `
    <div style="height:12px;"></div>
    <p style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin:0 0 8px;">Reste à sortir d'ici la fin du mois</p>
    <p style="font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:28px; color:var(--terracotta-900); margin:0 0 14px;">${fmt(totalDep)}</p>
    ${dep.length === 0
      ? `<p style="font-size:12px; color:var(--muted); margin:0 0 22px;">Aucune dépense à venir.</p>`
      : `<div class="drawer-card">${dep.map(it => `<div class="row" style="color:var(--ink);"><span>${rowIcon(it)}${dateShort(it.date)} · ${it.nom}</span><span class="row-right">${fmt(it.amount)}</span></div>`).join('')}</div><div style="height:18px;"></div>`
    }
    ${rev.length > 0 ? `
      <div style="border-top:1px solid rgba(32,30,29,0.12); margin-bottom:14px;"></div>
      <p style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin:0 0 8px;">Revenus restants</p>
      <p style="font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:22px; color:var(--indigo-900); margin:0 0 14px;">+${fmt(totalRev)}</p>
      <div class="drawer-card">${rev.map(it => `<div class="row" style="color:var(--indigo-900);"><span>${rowIcon(it)}${dateShort(it.date)} · ${it.nom}</span><span class="row-right">+${fmt(it.amount)}</span></div>`).join('')}</div>
    ` : ''}
    <div style="height:20px;"></div>`;
}

function renderProjectsTab(s) {
  const bucketOf = (p) => {
    const lines = s.projectLines.filter(l => l.projectId === p.id);
    if (lines.length === 0) return 'now'; // projet tout juste créé, pas encore de ligne : reste visible
    if (lines.some(l => lineMonth(l) === CURRENT_ABS)) return 'now';
    if (lines.some(l => lineMonth(l) > CURRENT_ABS)) return 'future';
    return 'past';
  };
  const nowProjects = s.projects.filter(p => bucketOf(p) === 'now');
  const futureProjects = s.projects.filter(p => bucketOf(p) === 'future');
  const pastProjects = s.projects.filter(p => bucketOf(p) === 'past');
  const activeProjects = [...nowProjects, ...futureProjects];
  const totalActive = s.projectLines.filter(l => l.type === 'depense' && activeProjects.some(p => p.id === l.projectId)).reduce((a, l) => a + l.amount, 0);

  const sectionLabel = (text) => `<p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px;">${text}</p>`;

  return `
    <p class="subpage-title">Projets</p>
    ${s.projects.length > 0 ? `
      <div style="background: var(--prune-200); border-radius: 8px 22px 22px 22px; padding: 16px 18px; margin-bottom: 16px;">
        <p style="font-size: 12px; color: var(--prune-800); margin: 0 0 2px;">${activeProjects.length} projet${activeProjects.length > 1 ? 's' : ''} actif${activeProjects.length > 1 ? 's' : ''}</p>
        <p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; color: var(--prune-900); margin: 0; letter-spacing: -0.02em;">${fmt(totalActive)}</p>
      </div>
      <button class="add-row" style="color: var(--off-white); background: var(--prune-900); border-radius: 6px 18px 18px 18px; padding: 11px 16px; margin-bottom: 6px; width: 100%; box-sizing: border-box; border: none; font-family: 'Inter', sans-serif; font-size: 13px; justify-content: center;" onclick="openNewProjectSheet()">${plusSvg('var(--off-white)')}<span>Nouveau projet</span></button>

      ${nowProjects.length > 0 ? sectionLabel('Ce mois-ci') + nowProjects.map(p => renderProjectRow(s, p, s.projectLines.filter(l => l.projectId === p.id))).join('') : ''}
      ${futureProjects.length > 0 ? sectionLabel('À venir') + futureProjects.map(p => renderProjectRow(s, p, s.projectLines.filter(l => l.projectId === p.id))).join('') : ''}
      ${pastProjects.length > 0 ? `
        <div style="display:flex; align-items:center; gap:6px; cursor:pointer; margin:18px 0 8px;" onclick="togglePastProjects()">
          <p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 0;">Projets passés (${pastProjects.length})</p>
          <span class="chev ${s.showPastProjects ? 'open' : ''}">${chevronSvg('var(--muted)')}</span>
        </div>
        ${s.showPastProjects ? pastProjects.map(p => renderProjectRow(s, p, s.projectLines.filter(l => l.projectId === p.id))).join('') : ''}
      ` : ''}
    ` : `
      <div style="text-align: center; padding: 40px 20px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--prune-200); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;">${flagSvg('var(--prune-800)')}</div>
        <p style="font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.5;">Un voyage, des travaux, un événement —<br>regroupe-le à part de ton quotidien.</p>
        <button class="add-row" style="color: var(--off-white); background: var(--prune-900); border-radius: 6px 18px 18px 18px; padding: 11px 20px; border: none; font-family: 'Inter', sans-serif; font-size: 13px; display: inline-flex;" onclick="openNewProjectSheet()">${plusSvg('var(--off-white)')}<span>Créer un premier projet</span></button>
      </div>
    `}
  `;
}

function renderAnalyticsTab(s, m) {
  const revenuHabituel = getIncomeForMonth(m);
  const revenuProjets = s.projectLines.filter(l => l.type === 'revenu' && lineMonth(l) === m).reduce((a, l) => a + l.amount, 0);
  const revenuRemb = s.refunds.filter(r => r.confirmed && periodOfDate(r.date) === m).reduce((a, r) => a + r.amount, 0);
  const totalRevenus = revenuHabituel + revenuProjets + revenuRemb;

  const catTotals = {};
  const addCat = (cat, amt) => { const key = cat || 'Sans catégorie'; catTotals[key] = (catTotals[key] || 0) + amt; };
  s.recurrentDefs.filter(d => activeInMonth(d, m)).forEach(d => addCat(d.categorie, effectiveMontant(d, m)));
  s.ponctuelles.filter(p => periodOfDate(p.date) === m).forEach(p => addCat(p.categorie, p.amount));
  s.envelopeItems.filter(i => i.month === m).forEach(i => addCat(i.categorie, i.amount));
  s.projectLines.filter(l => l.type === 'depense' && lineMonth(l) === m).forEach(l => addCat(l.categorie, l.amount));
  // « Sans catégorie » n'est pas un poste comme les autres : il part en fin de liste
  // et reste en gris, pour ne pas dominer visuellement les vraies catégories.
  const catList = Object.entries(catTotals).sort((a, b) => {
    if (a[0] === 'Sans catégorie') return 1;
    if (b[0] === 'Sans catégorie') return -1;
    return b[1] - a[1];
  });
  // Le vrai maximum, pas le premier de la liste : « Sans catégorie » est rejeté
  // en fin de tri mais peut rester le plus gros montant.
  const maxCat = catList.length ? Math.max(...catList.map(e => e[1])) : 1;
  const catColors = ['var(--indigo-800)', 'var(--terracotta-800)', 'var(--moutarde-800)', 'var(--sauge-800)', 'var(--prune-800)'];

  const activeEnvs = s.envelopeDefs.filter(e => m >= e.startMonth);
  const activeProjects = s.projects.filter(p => s.projectLines.some(l => l.projectId === p.id && lineMonth(l) === m));

  return `
    <p class="subpage-title">Analytique</p>
    <div class="month-nav" style="margin-bottom:16px;">
      <button aria-label="Mois précédent" onclick="prevMonth()">${chevronLeftSvg('#645c50')}</button>
      <button class="month-btn" onclick="openMonthSheet()">
        <span class="month-label">${monthYearLabel(m)}</span>
        ${monthStartDay() > 1 ? `<span class="month-shift">${monthShiftSvg()}</span>` : ''}
      </button>
      <button aria-label="Mois suivant" onclick="nextMonth()">${chevronSvg('#645c50')}</button>
    </div>

    <div style="background: var(--indigo-200); border-radius: 8px 22px 22px 22px; padding: 16px 18px; margin-bottom: 14px;">
      <p style="font-size: 12px; color: var(--indigo-800); margin: 0 0 2px;">Revenus du mois</p>
      <p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; color: var(--indigo-900); margin: 0 0 10px; letter-spacing: -0.02em;">${fmt(totalRevenus)}</p>
      <div style="display:flex; justify-content:space-between; font-size:12px; color: var(--indigo-800); padding:3px 0;"><span>Revenus récurrents et ponctuels</span><span>${fmt(revenuHabituel)}</span></div>
      ${revenuProjets > 0 ? `<div style="display:flex; justify-content:space-between; font-size:12px; color: var(--indigo-800); padding:3px 0;"><span>Projets</span><span>${fmt(revenuProjets)}</span></div>` : ''}
      ${revenuRemb > 0 ? `<div style="display:flex; justify-content:space-between; font-size:12px; color: var(--indigo-800); padding:3px 0;"><span>Remboursements</span><span>${fmt(revenuRemb)}</span></div>` : ''}
    </div>

    <div style="background: var(--terracotta-200); border-radius: 6px 20px 20px 20px; padding: 16px 18px; margin-bottom: 14px;">
      <p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; color: var(--terracotta-900); margin: 0 0 12px;">Dépenses par catégorie</p>
      ${catList.length === 0 ? `<p style="font-size:12px; color:var(--muted);">Rien à afficher ce mois-ci.</p>` : catList.map(([cat, amt], i) => {
        const c = cat === 'Sans catégorie' ? 'rgba(32,30,29,0.28)' : catColors[i % catColors.length];
        return `
        <div class="analytics-cat-row">
          <span style="display:inline-block; width:8px; height:8px; border-radius:2px; background:${c}; flex-shrink:0;"></span>
          <span style="font-size:12px; min-width:74px;">${cat}</span>
          <div class="analytics-cat-bar-bg"><div class="analytics-cat-bar-fill" style="width:${Math.round(amt / maxCat * 100)}%; background:${c};"></div></div>
          <span style="font-size:12px; font-weight:600; min-width:44px; text-align:right;">${fmt(amt)}</span>
        </div>`;
      }).join('')}
    </div>

    <div style="background: var(--moutarde-200); border-radius: 6px 20px 20px 20px; padding: 16px 18px;">
      <p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; color: var(--moutarde-900); margin: 0 0 12px;">Consommation des budgets</p>
      ${activeEnvs.length === 0 ? `<p style="font-size:12px; color:var(--moutarde-900); opacity:0.7;">Aucun budget actif. Tu peux en créer un depuis l'accueil.</p>` : activeEnvs.map(env => {
        const spent = s.envelopeItems.filter(i => i.envelopeId === env.id && i.month === m).reduce((a, it) => a + it.amount, 0);
        const pct = Math.min(100, Math.round(spent / env.montant * 100));
        const over = spent > env.montant;
        return `
          <div style="margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; font-size:12px; color: var(--moutarde-900); margin-bottom:4px;"><span style="font-weight:600;">${env.nom}</span><span>${fmt(spent)} / ${fmt(env.montant)}</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%; background: ${over ? 'var(--terracotta-800)' : 'var(--moutarde-900)'};"></div></div>
          </div>`;
      }).join('')}
    </div>

    ${activeProjects.length > 0 ? `
    <div style="background: var(--prune-200); border-radius: 6px 20px 20px 20px; padding: 16px 18px; margin-top: 14px;">
      <p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; color: var(--prune-900); margin: 0 0 12px;">Projets</p>
      ${activeProjects.map(p => {
        const lines = s.projectLines.filter(l => l.projectId === p.id && lineMonth(l) === m);
        const dep = lines.filter(l => l.type === 'depense').reduce((a, l) => a + l.amount, 0);
        const rev = lines.filter(l => l.type === 'revenu').reduce((a, l) => a + l.amount, 0);
        return `
          <div style="display:flex; justify-content:space-between; font-size:12px; color: var(--prune-900); padding:5px 0;">
            <span style="font-weight:600;">${p.nom}</span>
            <span>${rev > 0 ? `+${fmt(rev)} · ` : ''}-${fmt(dep)}</span>
          </div>`;
      }).join('')}
    </div>` : ''}

    ${(() => {
      // Cascade façon compte de résultat : miroir de l'accueil, qui part du solde
      // pour descendre dans le détail. Ici on remonte du détail vers le solde.
      const recurrentTotal = s.recurrentDefs.filter(d => activeInMonth(d, m)).reduce((a, d) => a + effectiveMontant(d, m), 0);
      const budgetsTotal = s.envelopeDefs.filter(e => m >= e.startMonth).reduce((a, e) => {
        const spent = s.envelopeItems.filter(i => i.envelopeId === e.id && i.month === m).reduce((x, i) => x + i.amount, 0);
        return a + Math.max(e.montant, spent);
      }, 0);
      const ponctuellesTotal = s.ponctuelles.filter(p => {
        return periodOfDate(p.date) === m;
      }).reduce((a, p) => a + p.amount, 0);
      const projetsDep = s.projectLines.filter(l => l.type === 'depense' && lineMonth(l) === m).reduce((a, l) => a + l.amount, 0);
      const balA = estimatedBalance(m);
      const solde = balA.total;

      const ligne = (label, montant, signe) => `
        <div style="display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; font-size:13px; color: var(--indigo-900);">
          <span style="opacity:0.8;">${label}</span>
          <span style="font-weight:600;">${signe}${fmt(montant)}</span>
        </div>`;

      return `
      <div style="background: var(--indigo-200); border-radius: 6px 20px 20px 20px; padding: 16px 18px; margin-top: 14px;">
        <p style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; color: var(--indigo-900); margin: 0 0 6px;">Ce qu'il reste</p>
        ${balA.ancre ? ligne('Solde de départ', balA.opening, '') : ''}
        ${ligne('Revenus', totalRevenus, '+')}
        <div style="border-top:1px solid rgba(28,46,66,0.12);"></div>
        ${recurrentTotal > 0 ? ligne('Dépenses récurrentes', recurrentTotal, '−') : ''}
        ${budgetsTotal > 0 ? ligne('Budgets réservés', budgetsTotal, '−') : ''}
        ${ponctuellesTotal > 0 ? ligne('Dépenses ponctuelles', ponctuellesTotal, '−') : ''}
        ${projetsDep > 0 ? ligne('Projets', projetsDep, '−') : ''}
        <div style="border-top:1.5px solid rgba(28,46,66,0.25); margin-top:4px; padding-top:10px; display:flex; justify-content:space-between; align-items:baseline;">
          <span style="font-size:13px; font-weight:600; color: var(--indigo-900);">Solde estimé fin de mois</span>
          <span style="font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:22px; color: var(--indigo-900);">${fmt(solde)}</span>
        </div>
      </div>`;
    })()}

    ${renderRangeSection(s)}
  `;
}

// ----------------------------------------------------------------------------
//  Vue sur plusieurs mois : somme, moyenne, nombre de mois pris en compte.
// ----------------------------------------------------------------------------
function setAnalyticsRange(n) { setState({ analyticsRange: Number(n) }); }

function renderRangeSection(s) {
  const choix = [3, 6, 12];
  const n = s.analyticsRange || 0;

  const onglets = `
    <div class="range-tabs">
      <button class="range-tab ${n === 0 ? 'on' : ''}" onclick="setAnalyticsRange(0)">Ce mois</button>
      ${choix.map(k => `<button class="range-tab ${n === k ? 'on' : ''}" onclick="setAnalyticsRange(${k})">${k} mois</button>`).join('')}
    </div>`;

  if (n === 0) {
    return `
      <p class="field-label" style="margin-top:22px;">Sur plusieurs mois</p>
      ${onglets}
      <p style="font-size:12px; color:var(--muted); margin:10px 0 0; line-height:1.5;">Choisis une période pour voir tes sommes et tes moyennes.</p>`;
  }

  const agg = aggregateRange(n);
  if (agg.n === 0) {
    return `
      <p class="field-label" style="margin-top:22px;">Sur plusieurs mois</p>
      ${onglets}
      <p style="font-size:12px; color:var(--muted); margin:10px 0 0; line-height:1.5;">Aucune donnée sur cette période. Reviens quand tu auras quelques mois d'historique.</p>`;
  }

  const lignes = [
    ['Revenus', agg.somme.revenus, agg.moyenne.revenus, 'var(--indigo-900)'],
    ['Dépenses récurrentes', agg.somme.recurrent, agg.moyenne.recurrent, 'var(--terracotta-900)'],
    ['Budgets réservés', agg.somme.budgets, agg.moyenne.budgets, 'var(--moutarde-900)'],
    ['dont réellement dépensé', agg.somme.budgetsDepenses, agg.moyenne.budgetsDepenses, 'var(--muted)'],
    ['Dépenses ponctuelles', agg.somme.ponctuelles, agg.moyenne.ponctuelles, 'var(--sauge-900)'],
    ['Projets', agg.somme.projets, agg.moyenne.projets, 'var(--prune-900)'],
  ].filter(l => l[1] !== 0);

  const periode = agg.mois.length
    ? monthYearShort(agg.mois[0]) + ' → ' + monthYearShort(agg.mois[agg.mois.length - 1])
    : '';

  return `
    <p class="field-label" style="margin-top:22px;">Sur plusieurs mois</p>
    ${onglets}
    <p style="font-size:11.5px; color:var(--muted); margin:10px 0 8px;">
      ${periode}${agg.n < n ? ` · ${agg.n} mois sur ${n}` : ''}
    </p>

    <div class="range-table">
      <div class="range-head">
        <span></span><span>Total</span><span>Par mois</span>
      </div>
      ${lignes.map(([label, somme, moy, couleur]) => `
        <div class="range-row">
          <span style="color:${couleur};">${label}</span>
          <span style="font-weight:600;">${fmt(somme)}</span>
          <span style="color:var(--muted);">${fmt(Math.round(moy))}</span>
        </div>`).join('')}
      <div class="range-row total">
        <span>Reste</span>
        <span style="font-weight:700; color:var(--indigo-900);">${fmt(agg.somme.solde)}</span>
        <span style="color:var(--muted);">${fmt(Math.round(agg.moyenne.solde))}</span>
      </div>
    </div>

    ${(() => {
      // Récurrentes les plus anciennes : ce qui pèse depuis longtemps
      const m = absMonth(state.year, state.monthIndex);
      const anciennes = state.recurrentDefs
        .filter(d => activeInMonth(d, m))
        .map(d => ({ nom: d.nom, mois: recurrenceAge(d, m), montant: effectiveMontant(d, m) }))
        .filter(d => d.mois >= 2)
        .sort((a, b) => b.mois - a.mois)
        .slice(0, 4);
      if (!anciennes.length) return '';
      return `
        <p class="field-label" style="margin-top:20px;">Récurrentes de longue date</p>
        ${anciennes.map(d => `
          <div class="range-row" style="grid-template-columns: 1fr auto;">
            <span>${d.nom}</span>
            <span style="color:var(--muted); font-size:12px;">${d.mois} mois · ${fmt(d.montant * d.mois)} au total</span>
          </div>`).join('')}`;
    })()}
  `;
}

function renderProjectRow(s, p, lines) {
  const withState = lines.map(l => ({ ...l, state: dateState(l.date, l.confirmed) })).sort((a, b) => new Date(a.date) - new Date(b.date));
  const depTotal = withState.filter(l => l.type === 'depense').reduce((a, l) => a + l.amount, 0);
  const isExpanded = s.expandedProjectId === p.id;
  const showMonthHeaders = new Set(withState.map(l => lineMonth(l))).size > 1;
  let lastMonth = null;
  return `
    <div class="envelope" style="background: var(--prune-300);">
      <div class="envelope-head" style="color: var(--prune-900);" onclick="toggleProjectRow('${p.id}')">
        <span style="font-weight:600; display:flex; align-items:center; gap:6px;" onclick="event.stopPropagation(); toggleProjectNameEdit('${p.id}')">${p.nom}<span class="name-edit ${s.projectNameEditFor === p.id ? 'open' : ''}" onclick="event.stopPropagation(); openEditProject('${p.id}')">${editSvg()}</span></span>
        <span class="row-right">
          ${fmt(depTotal)}
          <span class="chev ${isExpanded ? 'open' : ''}">${chevronSvg('var(--prune-900)')}</span>
        </span>
      </div>
      <div class="collapse ${isExpanded ? 'open' : ''}" data-collapse-env="${p.id}">
        <div class="envelope-body">
          <div class="add-row" style="color: var(--prune-900); padding-bottom:6px;" onclick="openAddProjectLineFor('${p.id}')">${plusSvg('var(--prune-900)')}<span>Ajouter</span></div>
          ${withState.map(l => {
            const lm = lineMonth(l);
            const header = (showMonthHeaders && lm !== lastMonth) ? `<p style="font-size:10px; font-weight:700; color: var(--prune-900); opacity:0.55; margin:10px 0 4px; text-transform:uppercase; letter-spacing:0.04em;">${monthYearLabel(lm)}</p>` : '';
            lastMonth = lm;
            return header + `
            <div class="row" data-row-id="${l.id}" style="color: var(--prune-900); font-size:12px; cursor:pointer;" onclick="openEditProjectLine('${l.id}')">
              <span>${l.state === 'a_confirmer' ? clockSvg('var(--alert)') : l.state === 'a_venir' ? calendarSvg('var(--muted)') : ''}${dateShort(l.date)} · ${l.label}${l.categorie ? ` <span style="opacity:0.6;">· ${l.categorie}</span>` : ''}</span>
              <span class="row-right" style="color: ${l.type === 'revenu' ? 'var(--prune-900)' : 'inherit'};">${l.type === 'revenu' ? '+' : '-'}${fmt(l.amount)}
                ${l.state === 'a_confirmer' ? `<button class="confirm-btn" onclick="event.stopPropagation(); confirmProjectLine('${l.id}', this)" aria-label="Confirmer">${checkSvg('#fff')}</button>` : ''}
                
                
              </span>
            </div>`;
          }).join('')}
          ${withState.length === 0 ? `<p style="font-size:12px; color: var(--prune-900); opacity:0.6; margin:0;">Aucune ligne.</p>` : ''}
        </div>
      </div>
    </div>`;
}

const DIALOG_ACTIONS = {
  reallyAddCategory, reallyRenameCategory, reallyDeleteCategory,
  reallyDeleteRecurrentDef, reallyDeleteEnvelopeDef, reallyDeleteProject, reallyRenameProject,
  reallySetUserName, reallyDeleteIncomeRec, reallyStopRecurrent, reallyStopIncomeRec,
  reallyEditRecurrent, reallyEditIncomeRec,
  reallyImportData, reallyResetData, reallyConfirmNew, reallyConfirmNewRecurrent, reallyConfirmNewIncome, reallyConfirmNewIncomeRec,
};

let drawerDrag = null;
document.getElementById('screen').addEventListener('pointerdown', function (e) {
  const handle = e.target.closest('#drawerHandle');
  if (!handle) return;
  const wrapper = document.getElementById('drawerWrapper');
  const panel = document.getElementById('drawerPanel');
  if (!wrapper || !panel) return;
  wrapper.style.transition = 'none';
  drawerDrag = { startY: e.clientY, startHeight: wrapper.getBoundingClientRect().height, maxHeight: panel.scrollHeight };
  document.addEventListener('pointermove', onDrawerDragMove);
  document.addEventListener('pointerup', onDrawerDragEnd);
});
function onDrawerDragMove(e) {
  if (!drawerDrag) return;
  const wrapper = document.getElementById('drawerWrapper');
  if (!wrapper) return;
  const dy = e.clientY - drawerDrag.startY;
  const h = Math.max(0, Math.min(drawerDrag.maxHeight, drawerDrag.startHeight + dy));
  wrapper.style.height = h + 'px';
}
function onDrawerDragEnd(e) {
  if (!drawerDrag) return;
  const wrapper = document.getElementById('drawerWrapper');
  document.removeEventListener('pointermove', onDrawerDragMove);
  document.removeEventListener('pointerup', onDrawerDragEnd);
  const totalMove = Math.abs((e && e.clientY != null ? e.clientY : drawerDrag.startY) - drawerDrag.startY);
  let open;
  if (totalMove < 6) {
    // Simple tap, pas un glissement : on bascule l'état actuel.
    open = !(drawerDrag.startHeight > drawerDrag.maxHeight * 0.5);
  } else if (wrapper) {
    const finalH = parseFloat(wrapper.style.height) || 0;
    open = finalH > drawerDrag.maxHeight * 0.35;
  } else {
    open = state.drawerOpen;
  }
  if (wrapper) wrapper.style.transition = '';
  drawerDrag = null;
  setState({ drawerOpen: open });
}

// ============================================================================
//  DÉMARRAGE
//  On restaure les données enregistrées, puis on affiche. Si rien n'est
//  enregistré (première visite), l'app démarre vide.
// ============================================================================
(function boot() {
  const saved = loadState();
  if (saved) {
    PERSISTED_FIELDS.forEach(k => {
      if (saved[k] !== undefined && saved[k] !== null) state[k] = saved[k];
    });
  }
  refreshCurrentAbs();
  // On se replace toujours sur le mois en cours au démarrage.
  state.monthIndex = CURRENT_MONTH;
  state.year = CURRENT_YEAR;
})();

render();

// Rituel d'ouverture : l'app est déjà prête sous le loader, mais on laisse volontairement
// le temps à l'animation des 3 logos de se dérouler en entier (déploiement puis repli,
// 2.2s) avant de révéler le tableau de bord — sinon le geste serait coupé en plein élan.
// +200ms de pause volontaire après la fin du repli : le temps de bien voir le logo
// et le nom stabilisés ensemble avant que l'ouverture ne s'enclenche.
setTimeout(() => {
  const loader = document.getElementById('initialLoader');
  const screen = document.getElementById('screen');
  if (loader) loader.classList.add('loader-leaving');
  if (screen) screen.classList.add('app-opening');
  setTimeout(() => { if (loader) loader.remove(); }, 420);
}, 2400);
</script>
